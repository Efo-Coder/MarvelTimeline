<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCU Timeline – Fanpage</title>
  <meta name="description" content="Inoffizielle Fanpage: Alle Filme des Marvel Cinematic Universe chronologisch nach Phasen – als animierte Galaxie-Timeline.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23ec1d24'/%3E%3Cpath fill='%23fff' d='M20.3 14H28.3L31.9 39.8H32.1L35.7 14H43.7V50H38.4V22.7H38.3L34.2 50H29.4L25.3 22.7H25.2V50H20.3Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Sanfte Seiten-Einblendung: .js versteckt die Seite nur, wenn JS läuft;
       .page-ready startet die Überblendung nach dem ersten gerenderten Frame.
       Bewusst hier statt in main.js, damit die Seite auch bei einem Fehler
       dort nicht unsichtbar bleibt. */
    document.documentElement.classList.add('js');
    window.addEventListener('DOMContentLoaded', function () {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          document.body.classList.add('page-ready');
        });
      });
    });
  </script>
</head>
<body>

  <canvas id="galaxy" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="brand" href="#hero">
      <img class="brand-logo" src="assets/logos/Marvel_Logo.webp" alt="Marvel Logo">
      <span class="brand-text">Timeline</span>
    </a>
    <nav id="phase-nav" aria-label="Phasen"></nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <p class="hero-kicker">Eine inoffizielle Fan-Timeline</p>
      <h1>Marvel Cinematic Universe</h1>
      <div class="hero-spectrum" aria-hidden="true"></div>
      <p class="hero-sub">Alle Kinofilme – chronologisch, Phase für Phase.</p>
      <a class="scroll-hint" href="#phase-1" aria-label="Zur Timeline scrollen"><span></span></a>
    </section>

    <div id="phases"></div>
  </main>

  <footer class="site-footer">
    <p>Fanprojekt – nicht mit Marvel Studios oder The Walt Disney Company verbunden.
       Alle Filmtitel &amp; Logos gehören ihren jeweiligen Rechteinhabern.</p>
  </footer>

  <script src="js/vendor/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/galaxy.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
